<!DOCTYPE html>

</head>
<body class="bg-gray-900 text-gray-100 flex min-h-screen text-sm">

    <aside class="w-60 bg-gray-950 border-r border-gray-800 p-4 flex flex-col justify-between">
        <div class="space-y-6">
            <div class="text-xl font-black text-[#febd69] mb-6 border-b border-gray-800 pb-3">DATSHOP CENTRAL</div>
            <nav class="space-y-2">
                <a href="./index.html" class="block bg-blue-900/50 text-blue-400 border border-blue-800 text-center font-bold py-2 rounded mb-4 hover:bg-blue-900 transition">🌐 Xem Cửa Hàng</a>
                
                <a href="./admin-dashboard.html" class="block text-gray-400 hover:bg-gray-900 hover:text-white p-2.5 rounded transition">📊 Tổng quan hệ thống</a>
                <a href="./admin-products.html" class="block text-gray-400 hover:bg-gray-900 hover:text-white p-2.5 rounded transition">📦 Quản lý kho sản phẩm</a>

            </nav>
        </div>
        <a href="./index.html" class="text-xs text-center bg-gray-800 py-2 rounded text-gray-400 hover:text-white transition mt-8 block">← Thoát Admin (Về Trang Chủ)</a>
    </aside>

    <main class="flex-1 p-8">
        <h1 class="text-2xl font-bold mb-6">Xử lý đơn đặt hàng từ hệ thống</h1>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden shadow-xl">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-300 text-xs uppercase">
                    <tr>
                        <th class="p-4">Mã vận đơn</th>
                        <th class="p-4">Tên khách hàng</th>
                        <th class="p-4">Tổng thanh toán</th>
                        <th class="p-4">Trạng thái</th>
                        <th class="p-4">Hành động</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr class="hover:bg-gray-750">
                        <td class="p-4 font-mono text-xs text-amber-500">#AMZ-VNM-9921</td>
                        <td class="p-4 font-medium">Nguyễn Văn A</td>
                        <td class="p-4">1.200.000 đ</td>
                        <td class="p-4"><span class="bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded text-xs border border-amber-500/20">Chờ đóng gói</span></td>
                        <td class="p-4">
                            <select class="bg-gray-700 border border-gray-600 rounded p-1 text-xs text-white outline-none">
                                <option>Duyệt & Giao hàng</option>
                                <option>Hủy hóa đơn</option>
                            </select>
                        </td>

                </tbody>
            </table>
