<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex min-h-screen text-sm">

    <aside class="w-60 bg-gray-950 border-r border-gray-800 p-4 flex flex-col justify-between">
        <div class="space-y-6">
            <div class="text-xl font-black text-[#febd69] mb-6 border-b border-gray-800 pb-3">DATSHOP CENTRAL</div>
            <nav class="space-y-2">
                <a href="./index.html" class="block bg-blue-900/50 text-blue-400 border border-blue-800 text-center font-bold py-2 rounded mb-4 hover:bg-blue-900 transition">🌐 Xem Cửa Hàng</a>
                
                <a href="./admin-dashboard.html" class="block text-gray-400 hover:bg-gray-900 hover:text-white p-2.5 rounded transition">📊 Tổng quan hệ thống</a>
                <a href="./admin-products.html" class="block bg-gray-800 text-[#febd69] font-bold p-2.5 rounded">📦 Quản lý kho sản phẩm</a>
                <a href="./admin-orders.html" class="block text-gray-400 hover:bg-gray-900 hover:text-white p-2.5 rounded transition">🧾 Quản lý hóa đơn</a>
            </nav>
        </div>
        <a href="./index.html" class="text-xs text-center bg-gray-800 py-2 rounded text-gray-400 hover:text-white transition mt-8 block">← Thoát Admin (Về Trang Chủ)</a>
    </aside>

    <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Danh sách mặt hàng đang bán</h1>
            <button onclick="alert('Đã mở Form thêm sản phẩm')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-4 py-2 rounded">➕ Đăng sản phẩm mới</button>
        </div>

        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden shadow-xl">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-300 text-xs uppercase">
                    <tr>
                        <th class="p-4">Hình ảnh</th>
                        <th class="p-4">Tên hàng hóa</th>
                        <th class="p-4">Giá tiền</th>
                        <th class="p-4 text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr class="hover:bg-gray-750">
                        <td class="p-4"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=50" class="w-10 h-10 object-cover rounded border border-gray-600"></td>
                        <td class="p-4 font-medium">Tai nghe Premium Sound v2</td>
                        <td class="p-4 text-[#febd69]">1.200.000 đ</td>
                        <td class="p-4 text-center space-x-3">
                            <button class="text-blue-400 hover:underline">Sửa</button>
                            <button class="text-red-400 hover:underline">Xóa</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
