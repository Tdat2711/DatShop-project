<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng DatShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#eaeded] font-sans text-sm">

    <header class="bg-[#131921] text-white py-2 px-4">
        <a href="index.html" class="text-xl font-black">DatShop<span class="text-[#febd69]">.vn</span></a>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 py-6 flex flex-col md:flex-row gap-4">
        <div class="w-full md:w-3/4 bg-white p-6 shadow-sm">
            <h1 class="text-2xl font-normal border-b pb-2 mb-4 text-gray-900">Giỏ hàng mua sắm</h1>
            
            <div class="flex gap-4 border-b pb-4 items-start">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150" class="w-28 h-28 object-contain border p-1">
                <div class="flex-1 space-y-1">
                    <h3 class="text-base font-medium text-gray-900">Tai nghe chụp tai không dây chống ồn Premium Sound v2</h3>
                    <p class="text-xs text-green-700">Còn hàng trong kho</p>
                    <div class="flex items-center gap-4 text-xs pt-2">
                        <select class="bg-gray-100 border p-1 rounded text-xs shadow-sm">
                            <option>Số lượng: 1</option>
                        </select>
                        <button class="text-blue-600 hover:underline">Xóa mặt hàng này</button>
                    </div>
                </div>
                <p class="text-lg font-bold text-gray-900">1.200.000 đ</p>
            </div>
            <p class="text-right text-base pt-4">Tạm tính (1 sản phẩm): <span class="font-bold">1.200.000 đ</span></p>
        </div>

        <div class="w-full md:w-1/4 bg-white p-5 shadow-sm h-fit space-y-3">
            <div class="text-base">
                Tạm tính: <span class="font-bold text-lg text-gray-900">1.200.000 đ</span>
            </div>
            <label class="flex items-start gap-2 text-xs text-gray-700 cursor-pointer">
                <input type="checkbox" class="mt-0.5"> Đơn hàng này có chứa quà tặng
            </label>
            <button onclick="checkAuthBeforeCheckout()" class="w-full bg-[#f0c14b] hover:bg-[#e7b43b] text-black text-xs py-2 rounded-md font-medium border border-[#a88734] shadow-sm">Tiến hành thanh toán</button>

<script>
function checkAuthBeforeCheckout() {
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    
    if (isLoggedIn !== 'true') {
        alert('Vui lòng tạo tài khoản hoặc đăng nhập để bảo mật thông tin đơn hàng của bạn!');
        window.location.href = 'login.html';
    } else {
        alert('Đơn hàng của bạn đã được khởi tạo thành công! Vui lòng chờ nhân viên xác nhận.');
    }
}
</script>
        </div>
    </main>
</body>
</html>
