<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập DatShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-sm antialiased">

    <div class="flex flex-col items-center mt-6 mb-4">
        <a href="index.html" class="text-3xl font-black text-gray-900 tracking-tight">
            DatShop<span class="text-[#black] text-base font-normal">.vn</span>
        </a>
    </div>

    <div class="max-w-[350px] mx-auto border border-gray-300 rounded-md p-6 shadow-sm">
        <h1 class="text-2xl font-normal mb-4 text-gray-900" id="form-title">Đăng nhập</h1>
        
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-900 mb-1">Số di động hoặc email</label>
                <input type="text" required class="w-full border border-gray-400 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 rounded px-2 py-1.5 outline-none text-sm transition">
            </div>

            <div id="password-field">
                <label class="block text-xs font-bold text-gray-900 mb-1">Mật khẩu</label>
                <input type="password" class="w-full border border-gray-400 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 rounded px-2 py-1.5 outline-none text-sm transition">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-[#f0c14b] hover:bg-[#e7b43b] text-black text-xs py-1.5 rounded border border-[#a88734] shadow-sm font-medium">
                Tiếp tục
            </button>
        </form>

        <p class="text-xs text-gray-600 mt-4 leading-relaxed">
            Bằng việc tiếp tục, bạn đồng ý với <a href="#" class="text-blue-600 hover:underline hover:text-orange-600">Điều kiện sử dụng</a> và <a href="#" class="text-blue-600 hover:underline hover:text-orange-600">Thông báo bảo mật</a> của DatShop.
        </p>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center">
            <p class="text-xs text-gray-500 mb-2">Bạn mới biết đến DatShop?</p>
            <button onclick="toggleForm()" id="toggle-btn" class="w-full bg-gray-100 hover:bg-gray-200 border border-gray-400 text-xs py-1.5 rounded shadow-sm">
                Tạo tài khoản DatShop của bạn
            </button>
        </div>
    </div>

    <footer class="mt-12 border-t bg-gradient-to-t from-gray-50 to-white py-8 text-center text-xs text-gray-500 space-x-4">
        <a href="#" class="text-blue-600 hover:underline">Điều kiện sử dụng</a>
        <a href="#" class="text-blue-600 hover:underline">Thông báo bảo mật</a>
        <p class="mt-3 text-gray-400">© 1996-2026, DatShop.com, Inc. hoặc các công ty liên kết của nó</p>
    </footer>

    <script>
        let isLoginMode = true;

        function toggleForm() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const toggleBtn = document.getElementById('toggle-btn');
            
            if (!isLoginMode) {
                title.innerText = "Tạo tài khoản";
                submitBtn.innerText = "Đăng ký";
                toggleBtn.innerText = "Tôi đã có tài khoản? Đăng nhập";
            } else {
                title.innerText = "Đăng nhập";
                submitBtn.innerText = "Tiếp tục";
                toggleBtn.innerText = "Tạo tài khoản DatShop của bạn";
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            // Đánh dấu trạng thái là đã đăng nhập thành công vào bộ nhớ trình duyệt
            localStorage.setItem('isLoggedIn', 'true');
            alert(isLoginMode ? 'Đăng nhập thành công!' : 'Đăng ký tài khoản thành công!');
            
            // Quay trở lại trang trước đó hoặc về trang chủ
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
