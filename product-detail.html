<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chi tiết sản phẩm | DATSHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#eaeded] font-sans text-sm">

    <header class="bg-[#131921] text-white py-3 px-6 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <a href="./index.html" class="text-2xl font-black text-white">DatShop<span class="text-[#febd69] text-base">.vn</span></a>
        <a href="./products.html" class="text-xs bg-[#232f3e] hover:bg-[#37475a] px-3 py-1.5 rounded transition text-white font-medium">⬅ Trở lại danh sách sản phẩm</a>
    </header>

    <main class="max-w-[1300px] mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-8">
        <div class="md:col-span-5 flex justify-center sticky top-20 h-fit">
            <img id="product-img" src="" class="w-full max-h-[450px] object-contain border bg-white p-4 shadow-sm rounded-lg animate-fade-in">
        </div>

        <div class="md:col-span-4 space-y-4 bg-white p-5 rounded-lg border shadow-sm">
            <h1 id="product-title" class="text-2xl font-bold text-gray-900 leading-tight">Đang tải tên sản phẩm...</h1>
            <a href="#" class="text-xs text-blue-600 hover:underline block border-b pb-2">Ghé thăm gian hàng DatShopBasic</a>
            <p class="text-amber-500 text-xs"><span id="product-stars"></span> <span class="text-blue-600 ml-2">1.402 bài đánh giá</span></p>
            <hr>
            <div>
                <p class="text-xs text-gray-500 font-medium">Giá bán tại DatShop:</p>
                <p id="product-price" class="text-3xl font-black text-red-700 mt-1">0 đ</p>
            </div>
            <hr>
            <div>
                <h4 class="font-bold text-gray-900 mb-2 text-sm">Đặc điểm nổi bật của sản phẩm:</h4>
                <ul id="product-features" class="list-disc pl-5 text-xs text-gray-700 space-y-2">
                </ul>
            </div>
        </div>

        <div class="md:col-span-3 border border-gray-300 rounded-lg p-5 bg-white shadow-sm h-fit space-y-4 sticky top-20">
            <div id="sidebar-price" class="text-2xl font-black text-gray-900">0 đ</div>
            <p class="text-xs text-gray-600">Giao hàng miễn phí toàn quốc khi đặt mua trực tuyến tại hệ thống.</p>
            <p class="text-sm text-green-700 font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-green-700 inline-block"></span> Còn hàng trong kho.
            </p>

            <div>
                <label class="text-xs text-gray-600 block mb-1 font-medium">Số lượng mua:</label>
                <select id="product-quantity" class="bg-gray-100 border p-1 rounded text-xs outline-none w-16 cursor-pointer">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div class="space-y-2 pt-2">
                <button onclick="checkAuthBeforeAction('Đã thêm sản phẩm vào giỏ hàng thành công!')" class="w-full bg-[#febd69] hover:bg-[#f3a847] text-black text-xs py-2.5 rounded-full font-bold shadow-sm border border-[#a88734] transition">Thêm vào giỏ hàng</button>
                <button onclick="checkAuthBeforeAction('Mua ngay')" class="w-full bg-[#f0c14b] hover:bg-[#e7b43b] text-black text-xs py-2.5 rounded-full font-bold shadow-sm border border-[#a88734] transition">Mua ngay</button>
            </div>
        </div>
    </main>

    <script>
        // Cơ sở dữ liệu danh sách sản phẩm tương ứng với hệ thống
        const productsDatabase = {
            "1": {
                title: "Tai nghe chụp tai không dây chống ồn chủ động Premium Sound v2 - Thời lượng pin 40 tiếng, Sạc siêu nhanh chuẩn âm thanh Hi-Res",
                price: "1.200.000 đ",
                img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600",
                stars: "4.7 ⭐⭐⭐⭐⭐",
                features: [
                    "Chống ồn chủ động ANC tiên tiến nhất từ nhà sản xuất giúp lọc sạch tạp âm.",
                    "Màng loa rộng 40mm tái tạo dải âm trầm vô cùng sống động và sắc nét.",
                    "Chất liệu đệm tai bọc da protein êm ái, đeo thoải mái cả ngày dài không đau tai.",
                    "Thời lượng pin cực khủng lên đến 40 giờ sử dụng liên tục chỉ với một lần sạc."
                ]
            },
            "2": {
                title: "Đồng hồ thông minh SmartWatch theo dõi sức khỏe cao cấp - Màn hình AMOLED, Đo nhịp tim, Định vị GPS độc lập",
                price: "2.450.000 đ",
                img: "https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?w=600",
                stars: "4.5 ⭐⭐⭐⭐☆",
                features: [
                    "Màn hình cảm ứng AMOLED tràn viền, hiển thị sắc nét ngay cả dưới ánh nắng gắt.",
                    "Tích hợp cảm biến sinh học thế hệ mới giúp đo nhịp tim, SpO2 liên tục 24/7.",
                    "Hỗ trợ hơn 100 chế độ luyện tập thể thao chuyên nghiệp trong nhà và ngoài trời.",
                    "Khả năng chống nước đạt chuẩn 5ATM chịu áp lực nước ở độ sâu lên đến 50 mét."
                ]
            },
            "3": {
                title: "Loa Bluetooth di động Bass trầm chống nước IPX7 - Công suất 20W, Kết nối PartyBoost, Hát liên tục 12h",
                price: "890.000 đ",
                img: "https://images.unsplash.com/photo-1583394838336-acd977736f90?w=600",
                stars: "4.8 ⭐⭐⭐⭐⭐",
                features: [
                    "Hệ thống loa kép công suất 20W cho âm thanh bùng nổ, bass đập cực kỳ uy lực.",
                    "Công nghệ chống nước tuyệt đối IPX7 giúp bạn yên tâm mang đi bể bơi, bãi biển.",
                    "Sử dụng kết nối Bluetooth 5.3 mới nhất cho đường truyền mượt mà, không độ trễ.",
                    "Hỗ trợ tính năng ghép đôi 2 loa cùng loại tạo hiệu ứng âm thanh vòm Stereo đỉnh cao."
                ]
            },
            "4": {
                title: "Máy ảnh Mirrorless 24.2MP kèm Ống kính Kit thế hệ mới - Lấy nét theo mắt thực tế, Quay video 4K sắc nét",
                price: "14.500.000 đ",
                img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600",
                stars: "4.9 ⭐⭐⭐⭐⭐",
                features: [
                    "Cảm biến CMOS APS-C 24.2 Megapixel mang lại độ chi tiết cao và ảnh chụp nghệ thuật.",
                    "Công nghệ lấy nét tự động bắt trọn chủ thể đang di chuyển hoặc ánh mắt trong nháy mắt.",
                    "Quay phim độ phân giải cao 4K không bị crop khung hình, hỗ trợ cổng cắm mic rời.",
                    "Màn hình lật cảm ứng tiện lợi giúp việc quay Vlog hoặc chụp ảnh selfie cực dễ dàng."
                ]
            },
            "5": {
                title: "Bàn phím cơ Gaming không dây RGB độc đáo - Hotswap 3-mode, Switch cơ gõ êm ái, Pin sạc Lithium dung lượng cao",
                price: "1.750.000 đ",
                img: "https://images.unsplash.com/photo-1618384887929-16ec33fab9ef?w=600",
                stars: "4.6 ⭐⭐⭐⭐☆",
                features: [
                    "Hỗ trợ 3 chế độ kết nối đa năng tiện lợi: Cáp Type-C, Bluetooth 5.0 và Wireless 2.4Ghz.",
                    "Mạch xu hướng Hotswap dễ dàng tháo lắp, thay thế switch cơ theo sở thích cá nhân.",
                    "Dải đèn LED RGB với 16.8 triệu màu kèm theo hàng chục hiệu ứng nháy theo nhạc độc lạ.",
                    "Keycap chất liệu nhựa PBT bền bỉ gõ đầm tay, chống phai màu và chống bóng mờ sau thời gian dài."
                ]
            }
        };

        // Hàm tự động bóc tách ID từ thanh địa chỉ để lấy dữ liệu đổ ra giao diện web
        function loadProductDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            let productId = urlParams.get('id');

            if (!productId || !productsDatabase[productId]) {
                productId = "1"; 
            }

            const product = productsDatabase[productId];

            document.getElementById('product-title').innerText = product.title;
            document.getElementById('product-price').innerText = product.price;
            document.getElementById('sidebar-price').innerText = product.price;
            document.getElementById('product-img').src = product.img;
            document.getElementById('product-img').alt = product.title;
            document.getElementById('product-stars').innerText = product.stars;

            const featuresList = document.getElementById('product-features');
            featuresList.innerHTML = ""; 
            product.features.forEach(function(item) {
                const li = document.createElement('li');
                li.innerText = item;
                featuresList.appendChild(li);
            });
        }

        window.addEventListener('DOMContentLoaded', loadProductDetails);

        // Hàm xử lý khi bấm nút "Thêm vào giỏ hàng" hoặc "Mua ngay"
        function checkAuthBeforeAction(successMessage) {
            // 1. Kiểm tra trạng thái đăng nhập
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                alert('Yêu cầu hệ thống: Bạn cần phải đăng nhập hoặc đăng ký tài khoản trước khi thực hiện mua sắm!');
                window.location.href = './login.html';
                return; 
            }

            // 2. Lấy thông tin sản phẩm hiện tại để bỏ vào giỏ hàng
            const urlParams = new URLSearchParams(window.location.search);
            let productId = urlParams.get('id') || "1";
            const product = productsDatabase[productId];

            // Lấy chính xác số lượng người dùng chọn từ thẻ <select> qua ID
            const quantitySelect = document.getElementById('product-quantity');
            const quantity = parseInt(quantitySelect.value) || 1;

            // 3. Khởi tạo cấu trúc giỏ hàng trong localStorage (Nếu chưa có)
            let cart = JSON.parse(localStorage.getItem('datshop_cart')) || [];

            // Kiểm tra xem sản phẩm này đã nằm trong giỏ chưa
            const existingProductIndex = cart.findIndex(item => item.id === productId);

            if (existingProductIndex > -1) {
                // Nếu có rồi thì cộng dồn số lượng tuyển chọn
                cart[existingProductIndex].quantity += quantity;
            } else {
                // Nếu chưa có thì thêm mới sản phẩm vào mảng
                cart.push({
                    id: productId,
                    title: product.title,
                    price: product.price,
                    img: product.img,
                    quantity: quantity
                });
            }

            // 4. Lưu lại mảng giỏ hàng mới vào trình duyệt
            localStorage.setItem('datshop_cart', JSON.stringify(cart));
            
            // 5. Điều hướng hoặc thông báo dựa trên nút bấm
            if (successMessage === 'Mua ngay') {
                // Chuyển thẳng sang trang giỏ hàng để thanh toán luôn
                window.location.href = './cart.html';
            } else {
                // Nếu bấm Thêm vào giỏ, hiện thông báo alert thông thường
                alert(successMessage);
            }
        }
    </script>
</body>
</html>
